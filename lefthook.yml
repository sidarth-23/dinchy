# Git hooks install automatically via `mise install` (see the [hooks] postinstall in mise.toml).
pre-commit:
    jobs:
        - name: validate and generate
          group:
              parallel: true
              jobs:
                  - name: validate event catalog
                    glob: "internal/events/catalog*.json"
                    run: go run ./cmd/validate event -input internal/events/catalog.json

                  - name: validate i18n catalog
                    glob: "internal/i18n/catalog/**/*.json"
                    run: go run ./cmd/validate i18n -input internal/i18n/catalog

                  - name: validate permission catalog
                    glob: "internal/access/permission/{permissions,roles}.json"
                    run: go run ./cmd/validate permission

                  - name: coderules logreturn
                    glob: "*.go"
                    run: go run ./cmd/coderules logreturn ./...

                  - name: generate catalogs
                    glob: "internal/{events/catalog*.json,i18n/catalog/**/*.json,access/permission/{permissions,roles}.json}"
                    run: go generate ./internal/i18n ./internal/events ./internal/access/permission && git add internal/events/generated.go internal/i18n/generated.go internal/access/permission/permission_generated.go internal/access/permission/role_generated.go

                  - name: generate sqlc
                    glob: "{sqlc.yaml,internal/platform/store/queries/*,internal/platform/store/migrations/*}"
                    run: mise exec -- sqlc generate && git add internal/platform/store/sqlcgen

        - name: golangci-lint
          glob: "*.go"
          run: for dir in $(printf '%s\n' {staged_files} | xargs -n1 dirname | sort -u); do mise run lint:fix -- --new-from-rev=HEAD "$dir" || exit $?; done
          stage_fixed: true
