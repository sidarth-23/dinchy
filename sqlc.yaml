version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/platform/store/queries"
    schema: "internal/platform/store/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/platform/store/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
