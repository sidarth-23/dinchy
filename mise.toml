[tools]
go = "1.26.3"
bun = "1.3.14"
node = "24.15.0"
"github:sqlc-dev/sqlc" = "1.31.1"
"github:pressly/goose" = "3.27.1"
"github:golangci/golangci-lint" = "2.12.2"
lefthook = "2.1.9"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.0"
# mkcert is the single local certificate authority: it issues the cert Caddy serves for
# dev HTTPS, and Mailpit's STARTTLS cert. Production uses Caddy's ACME automation instead.
"aqua:FiloSottile/mkcert" = "latest"
# Caddy terminates all TLS and routes every deployment. This vanilla build covers
# development; `mise run caddy:build` replaces it in tmp/ when plugins are declared in
# deploy/caddy/plugins.txt, so contributors who touch no plugins never need a build.
"aqua:caddyserver/caddy" = "2"
# xcaddy compiles Caddy with plugins. Operators are meant to extend their own Caddy, so
# this is a supported path rather than a maintainer-only trick.
"go:github.com/caddyserver/xcaddy/cmd/xcaddy" = "0.4.6"
uv = "latest"
"pipx:podman-compose" = "1.6.0"

# .env holds your working config, .env.local optional overrides that win over .env.
[env]
_.file = [".env", ".env.local"]

[tasks]
dev = "go run ./cmd/dinchy"
# Generate locally-trusted TLS certs (mkcert) for Caddy and Mailpit, so dev runs over
# verified TLS like production. Covers localhost and *.localhost for deployment routes.
"dev:certs" = "bash deploy/certs/gen-dev-certs.sh"
# Run Caddy against the configuration Dinchy pushes over the admin API. Start
# `mise run dev` first: Caddy comes up with only its admin endpoint, then Dinchy
# converges it. --resume restores the last pushed configuration across restarts.
"caddy:dev" = "caddy run --resume"
# Rebuild Caddy with the plugins declared in deploy/caddy/plugins.txt.
"caddy:build" = "bash deploy/caddy/build.sh"
# Print the Caddy modules compiled into the binary Dinchy will introspect.
"caddy:modules" = "caddy list-modules --versions"
# NETAVARK_FW (if set in .env) is inherited from the mise env — see .env.example for the WSL2 note.
"infra:up" = "podman-compose up -d"
"infra:down" = "podman-compose down"
"infra:logs" = "podman-compose logs -f"
build = "go build -o dinchy ./cmd/dinchy"
test = "go test ./..."
# The race detector requires cgo; the app itself stays cgo-free, so race is an
# opt-in task for environments that have a C toolchain.
"test:race" = "CGO_ENABLED=1 go test -race ./..."
"test:cover" = "go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out"
lint = "golangci-lint run"
"lint:fix" = "golangci-lint run --fix"
"lint:logreturn" = "go run ./cmd/coderules logreturn ./..."
fmt = "golangci-lint fmt"
# Whole-codebase on purpose: a new //go:generate directive is picked up without editing
# this task. The pre-commit hook scopes generation per catalog; this is the exhaustive run.
generate = "go generate ./... && sqlc generate"
"db:migrate" = 'goose -dir internal/platform/store/migrations postgres "$DINCHY_POSTGRES_DSN" up'
"db:status" = 'goose -dir internal/platform/store/migrations postgres "$DINCHY_POSTGRES_DSN" status'
"web:build" = { dir = "web", run = "bun run build" }
"web:dev" = { dir = "web", run = "bun run dev" }

[settings]
experimental = true
auto_install = true
# Install pipx-backed tools (podman-compose) via uv/uvx instead of pipx, so no
# separate pipx install is required — mise manages uv as a tool above.
pipx.uvx = true

# Install git hooks as part of `mise install` so a fresh checkout is ready to commit.
[hooks]
postinstall = "lefthook install"
