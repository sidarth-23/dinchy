[tools]
go = "1.26.3"
bun = "1.3.14"
node = "24.15.0"
"ubi:sqlc-dev/sqlc" = "1.31.1"
"ubi:pressly/goose" = "3.27.1"
"ubi:golangci/golangci-lint" = "2.12.2"

[tasks]
dev = "go run ./cmd/dinchy"
build = "go build -o dinchy ./cmd/dinchy"
test = "go test ./..."
lint = "golangci-lint run"
fmt = "golangci-lint fmt"
generate = "sqlc generate"
"db:migrate" = "goose -dir internal/store/sqlite/migrations sqlite3 dinchy.db up"
"db:status" = "goose -dir internal/store/sqlite/migrations sqlite3 dinchy.db status"
"web:build" = { dir = "web", run = "bun run build" }
"web:dev" = { dir = "web", run = "bun run dev" }
"web:install" = { dir = "web", run = "bun install" }

[settings]
experimental = true
auto_install = true
