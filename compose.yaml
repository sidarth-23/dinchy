# Local development infrastructure for Dinchy: Postgres + Redis + Mailpit.
# Run via `task infra:up` (podman-compose — drives podman directly, no Docker daemon).
# Host ports are interpolated from the environment (.env): DINCHY_POSTGRES_PORT / DINCHY_REDIS_PORT / DINCHY_MAILPIT_*_PORT.
# The defaults below match .env.example; keep the two in step.
#
# Postgres and Redis run plaintext on loopback (dev only) — mounting TLS keys into
# rootless-podman containers is not worth the friction locally. Caddy still terminates
# HTTPS for the app, signing its own certificates, and Mailpit still enforces STARTTLS +
# auth from the mkcert pair `task tls:mailpit-cert` writes — Mailpit cannot generate one
# itself, which is the only reason mkcert is still here. Production infra TLS is configured
# separately in deploy/. Dev-only; production uses the units in deploy/quadlet/.
#
# Caddy is deliberately not a service here: it runs as a host process via
# `task caddy:dev`, matching the host-native systemd unit used in production.
services:
  postgres:
    image: docker.io/library/postgres:18
    ports:
      - "${DINCHY_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: dinchy
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: dinchy
    volumes:
      # From Postgres 18 the image's PGDATA is version-specific
      # (/var/lib/postgresql/18/docker), so the mount point is the parent directory. Mounting
      # /var/lib/postgresql/data instead would leave the real data directory in the
      # container's writable layer, discarded on every recreate.
      - dinchy-pg:/var/lib/postgresql
  redis:
    # 8.4+ required: the event bus uses XREADGROUP ... CLAIM (matches deploy quadlet).
    image: docker.io/library/redis:8.4
    ports:
      - "${DINCHY_REDIS_PORT:-6380}:6379"
    volumes:
      - dinchy-redis:/data
  mailpit:
    # Local SMTP sink with a web mailbox UI + REST API; catches the invite/reset
    # emails so the flows can be exercised without a real mail server. Enforces
    # STARTTLS + auth like production (no insecure/accept-any bypass).
    image: docker.io/axllent/mailpit:latest
    ports:
      - "${DINCHY_MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP intake (DINCHY_SMTP_PORT points here)
      - "${DINCHY_MAILPIT_UI_PORT:-8025}:8025"    # web UI + REST API
    volumes:
      # task exports DINCHY_DEV_CERT_DIR from the XDG state directory; there is no default
      # because a silently-empty mount would leave Mailpit serving no STARTTLS certificate.
      - ${DINCHY_DEV_CERT_DIR:?start local infra with `task infra:up`}:/certs:ro
    environment:
      # Require SMTP auth; credentials must match DINCHY_SMTP_USERNAME/PASSWORD in .env.
      MP_SMTP_AUTH: "dinchy:localpass"
      # STARTTLS from the mkcert pair, so the app's mandatory-TLS client connects and
    # verifies it through the system trust store.
      MP_SMTP_TLS_CERT: /certs/mailpit.pem
      MP_SMTP_TLS_KEY: /certs/mailpit-key.pem
volumes:
  dinchy-pg:
  dinchy-redis:
