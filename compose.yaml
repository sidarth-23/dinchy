# Local development infrastructure for Dinchy: Postgres + Redis.
# Run via `mise run infra:up` (podman-compose — drives podman directly, no Docker daemon).
# Host ports are interpolated from the environment (.env): DINCHY_POSTGRES_PORT / DINCHY_REDIS_PORT.
# Dev-only; production uses the systemd/quadlet units in deploy/quadlet/.
services:
  postgres:
    image: docker.io/library/postgres:16
    ports:
      - "${DINCHY_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: dinchy
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: dinchy
    volumes:
      - dinchy-pg:/var/lib/postgresql/data
  redis:
    # 8.4+ required: the event bus uses XREADGROUP ... CLAIM (matches deploy quadlet).
    image: docker.io/library/redis:8.4
    ports:
      - "${DINCHY_REDIS_PORT:-6380}:6379"
    volumes:
      - dinchy-redis:/data
volumes:
  dinchy-pg:
  dinchy-redis:
